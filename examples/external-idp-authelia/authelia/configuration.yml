---
# Authelia — the OpenID Connect provider for this example stack.
#
# EXAMPLE ONLY. The secrets in this file are committed on purpose so you can
# read them and see how the pieces fit; the key material it references is
# generated locally by ../generate-secrets.sh and is never committed. Do not
# reuse any of it anywhere real.
#
# Deliberately minimal: this is close to the least configuration that makes
# Authelia a working OIDC provider for Nextcloud's user_oidc app. Anything not
# needed for that is left at its default.

theme: 'light'

log:
  level: 'info'

server:
  address: 'tcp://0.0.0.0:9091'
  # Authelia will ONLY act as an OpenID Connect provider over https: it derives
  # the issuer from the request scheme and rejects anything but https outright
  # (internal/middlewares/authelia_context.go, IssuerURL). There is no setting
  # to relax that, which is why this example ships a self-signed CA in ../certs
  # rather than running plain http like the rest of the stack.
  tls:
    certificate: '/certs/authelia.crt'
    key: '/certs/authelia.key'

# Authelia requires these to boot; none of them affect the OIDC flow.
# The secrets below come from the generated .env, via the AUTHELIA_* environment
# variables compose passes in (Authelia maps those onto config keys). They are
# not in this file because they are key material, and key material does not
# belong in a repository.
identity_validation:
  reset_password: {}   # jwt_secret <- AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET

storage:
  # encryption_key <- AUTHELIA_STORAGE_ENCRYPTION_KEY
  local:
    path: '/data/db.sqlite3'

notifier:
  filesystem:
    filename: '/data/notification.txt'

session:
  # secret <- AUTHELIA_SESSION_SECRET
  # NOTE: this is Authelia's *legacy* single-domain form, used deliberately.
  # The modern `session.cookies:` form requires an `authelia_url`, and Authelia
  # rejects any non-https URL there. This example runs on plain http on
  # loopback, so the legacy form is what allows it to boot at all. Authelia
  # logs a deprecation warning for it; that warning is expected here.
  # A real deployment should use `cookies:` with an https `authelia_url`.
  domain: 'astrolabe.test'

authentication_backend:
  password_reset:
    disable: true
  file:
    path: '/config/users.yml'

# One factor only. Adding 2FA here would mean enrolling an authenticator
# before the example could log in even once.
access_control:
  default_policy: 'one_factor'

identity_providers:
  oidc:
    # hmac_secret <- AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET

    # The signing key whose public half Authelia publishes at /jwks.json.
    # Generated by ../generate-secrets.sh — run that before `docker compose up`.
    #
    # It MUST be asymmetric (RS256). A provider left on symmetric (HS256)
    # signing publishes an EMPTY key set, and the MCP server then cannot
    # verify any token — that is the "The JWK Set did not contain any keys"
    # failure, reported since MCP server 0.176.5 as `jwt/no_signing_keys`.
    jwks:
      - key_id: 'astrolabe'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/config/oidc.issuer.key" | mindent 10 "|" | msquote }}

    clients:
      # The single client this whole stack needs.
      #
      # Nextcloud's user_oidc app logs users in with it; Astrolabe then asks
      # user_oidc for that same user's token and presents it to the MCP
      # server. One client covers the entire path — you do NOT need a separate
      # client for Astrolabe or for the MCP server.
      - client_id: 'nextcloud'
        client_name: 'Nextcloud'
        # Digest of 'insecure_secret' — from Authelia's own documentation.
        client_secret: '$pbkdf2-sha512$310000$c8p78n7pUMln0jzvd4aK4Q$JNRBzwAo0ek5qKn50cFzzvE9RXV88h1wJn5KGiHrD0YKtZaR/nCb2CJPOsKaPK0hjf.9yHxzQGZziziccp6Yng'
        public: false
        authorization_policy: 'one_factor'
        require_pkce: true
        pkce_challenge_method: 'S256'
        # user_oidc's callback. The host must match the URL your *browser*
        # uses for Nextcloud, not the container name.
        redirect_uris:
          - 'http://nc.astrolabe.test:8080/apps/user_oidc/code'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          # user_oidc asks for a 'groups' claim; Authelia refuses the whole
          # authorization request if the claim is requested without the scope
          # ("the client requested claims were not permitted").
          - 'groups'
          # offline_access lets user_oidc refresh the login token instead of
          # forcing a re-login when it expires. Authelia warns if you keep the
          # 'refresh_token' grant without it.
          - 'offline_access'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
          - 'refresh_token'
        # Issue JWT access tokens instead of opaque ones, so the MCP server can
        # verify them against the JWKS above with no round trip to Authelia.
        access_token_signed_response_alg: 'RS256'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'
