sonar.projectKey=cbcoutinho_astrolabe
sonar.organization=cbcoutinho

sonar.sources=lib,src,appinfo,templates
sonar.tests=tests

# S5332 (clear-text protocols): http:// strings in test fixtures exercise
# scheme-branching logic, not real network endpoints. Production code does
# default to http://localhost in NcInternalUrlResolver — that is intentional
# for self-hosted/Docker installs where PHP and Nextcloud share a host, and
# is documented inline at the call site.
# Use "tests/**" (not "tests/**/*"): the trailing "/*" can fail to match
# files directly under tests/<subdir>/ in some Ant-glob implementations.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**
