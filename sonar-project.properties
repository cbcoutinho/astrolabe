sonar.projectKey=cbcoutinho_astrolabe
sonar.organization=cbcoutinho

sonar.sources=lib,src,appinfo,templates
sonar.tests=tests

# The standalone Next.js apps — the marketing site (website/) and the docs site
# (docs/) — are out of scope for this PHP-focused project. They have their own
# tooling (tsc, ESLint/Stylelint, build CI) and are intentionally self-contained
# (each deploys independently), so their small, deliberate component duplication
# would otherwise trip the new-code duplication quality gate. Exclude them from
# analysis here; they are gated by their own pipelines.
sonar.exclusions=docs/**,website/**

# S5332 (clear-text protocols) in test fixtures is suppressed inline with
# // NOSONAR markers — the global ignore.multicriteria pattern proved
# unreliable on SonarCloud. Production code intentionally defaults to
# http://localhost in NcInternalUrlResolver for self-hosted/Docker
# installs; that decision is documented inline at the call site.
