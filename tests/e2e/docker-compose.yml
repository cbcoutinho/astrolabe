# Docker Compose for Astrolabe E2E tests
#
# Provides a complete Nextcloud + MCP server (login-flow mode) environment
# for testing the Astrolabe frontend UI.
#
# The MCP server image tag is pinned below and updated separately
# (e.g. by Renovate) when new versions are released.
#
# NOTE: This compose file is intended to be run via `npx playwright test`,
# which starts it through tests/e2e/start-server.js. If running directly,
# generate your own TOKEN_ENCRYPTION_KEY:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"

services:
  db:
    image: docker.io/library/mariadb:lts@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
    restart: "no"
    command: --transaction-isolation=READ-COMMITTED
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud

  redis:
    image: docker.io/library/redis:alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: "no"

  app:
    image: docker.io/library/nextcloud:32@sha256:babc1c0990f246a687dbce71805c9d1c3564d6dd00c5c0cdc338fddfcc05e668
    restart: "no"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - redis
      - db
    volumes:
      # Mount the astrolabe app (project root, already built) into Nextcloud
      - ../../:/opt/apps/astrolabe:ro
      # Post-installation hooks to configure Nextcloud for testing
      - ./app-hooks:/docker-entrypoint-hooks.d:ro
    environment:
      NEXTCLOUD_TRUSTED_DOMAINS: "app localhost"
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_HOST: db
      REDIS_HOST: redis
      MCP_SERVER_URL: http://mcp:8000
      # Dedicated TaskProcessing workers (see app-hooks/before-starting). Cron
      # drives synchronous providers only every 5 minutes, which is unusable for
      # an Assistant chat turn or a Summarize click; workers cut pickup latency
      # to about a second. Several run so a slow multimodal summary cannot block
      # a chat turn queued behind it.
      TASKPROCESSING_WORKERS: "4"
      TASKPROCESSING_WORKER_TIMEOUT: "300"
    healthcheck:
      test: ["CMD-SHELL", "curl -Ss http://localhost/status.php | grep '\"installed\":true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30

  mcp:
    # renovate: datasource=docker depName=ghcr.io/cbcoutinho/nextcloud-mcp-server
    image: ghcr.io/cbcoutinho/nextcloud-mcp-server:0.181.0@sha256:d69ae9a0b54dc7f34237d35224117498fa06d95ac767bb2b16ceaa24e15a6070
    restart: "no"
    command: ["--transport", "streamable-http", "--oauth"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mcp-data:/app/data
      - mcp-oauth-storage:/app/.oauth
    environment:
      NEXTCLOUD_HOST: http://app:80
      NEXTCLOUD_MCP_SERVER_URL: http://localhost:8000
      NEXTCLOUD_PUBLIC_ISSUER_URL: http://localhost:8080
      # Issuer the `oidc` app actually stamps into tokens. It builds `iss` from
      # scheme + host only (TokenGenerationRequestListener parses PHP_URL_SCHEME
      # and PHP_URL_HOST, never PHP_URL_PORT), so on any non-standard port the
      # issuer loses the port and will not match NEXTCLOUD_HOST or the public
      # issuer URL. /mcp verifies `iss`; the management API deliberately skips
      # it, so without this only half the integration works and the failure looks
      # like a bad token rather than a mismatched issuer.
      OIDC_ISSUER: http://localhost
      # 0.91.x dropped ENABLE_LOGIN_FLOW; deployment mode now selects the auth flow (ADR-022)
      MCP_DEPLOYMENT_MODE: login_flow
      # 0.91.x gates the management/vector-viz API on a client_id allowlist;
      # must match the OIDC client_id registered in app-hooks/25-configure-mcp-server.sh
      ALLOWED_MGMT_CLIENT: astrolabeE2eTestOidcClientId00001
      # TEST-ONLY key — do not use in production. Generate your own with:
      # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      TOKEN_ENCRYPTION_KEY: "W6NuJUhEl2eWBvWsVAa5XRZMMvpQ7Aubr3yI55F7oKw="
      TOKEN_STORAGE_DB: /app/data/tokens.db
      ENABLE_SEMANTIC_SEARCH: "true"
      # Shared secret for the webhook ingress (/webhooks/nextcloud). Astrolabe's
      # native sync listeners authenticate with this; it must match the
      # mcp_webhook_secret set on the Nextcloud side in
      # app-hooks/post-installation/25-configure-mcp-server.sh. TEST-ONLY value.
      WEBHOOK_SECRET: "astrolabe-e2e-webhook-secret"
      VECTOR_SYNC_SCAN_INTERVAL: "5"
      VECTOR_SYNC_USER_POLL_INTERVAL: "5"
      VECTOR_SYNC_PROCESSOR_WORKERS: "2"
      QDRANT_LOCATION: ":memory:"

volumes:
  mcp-data:
  mcp-oauth-storage:
