# E2E integration tests for Astrolabe frontend
#
# Runs Playwright tests against a real Nextcloud + MCP server environment
# using docker-compose. The MCP server runs in login-flow mode.
#
# SPDX-FileCopyrightText: 2025 Astrolabe contributors
# SPDX-License-Identifier: MIT

name: E2E Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: e2e

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        with:
          fallbackNode: '^22'
          fallbackNpm: '^10'

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Get php version
        id: php-versions
        uses: icewind1991/nextcloud-version-matrix@8a7bac6300b2f0f3100088b297995a229558ddba # v1.3.2
        with:
          filename: appinfo/info.xml

      - name: Set up PHP ${{ steps.php-versions.outputs.php-max }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ steps.php-versions.outputs.php-max }}
          coverage: none

      - name: Install dependencies & build app
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          composer install --no-dev --optimize-autoloader
          npm ci
          npm run build

      - name: Get installed Playwright version
        id: playwright
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # Install the OS-level libraries Playwright's browsers need. These are
      # not part of the cached ~/.cache/ms-playwright dir, so this runs on
      # every job; apt is reliable, so no retry is needed here.
      - name: Install Playwright OS dependencies
        timeout-minutes: 8
        run: npx playwright install-deps chromium

      # Provision Chromium WITHOUT the Playwright CDN. The cdn.playwright.dev
      # download deterministically stalls at "100%" on GitHub's runners (it never
      # finalizes — confirmed over multiple runs), so instead we copy the browsers
      # out of the official Playwright container image, which is served from
      # mcr.microsoft.com (a container registry, unaffected by the CDN issue).
      # Runs only on a cache miss; on a hit the cached browsers under
      # ~/.cache/ms-playwright are reused. The image tag matches the installed
      # @playwright/test version, so the Chromium build is guaranteed to match.
      - name: Provision Playwright browsers from official image
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          image="mcr.microsoft.com/playwright:v${{ steps.playwright.outputs.version }}-noble"
          echo "Pulling ${image}"
          docker pull "${image}"
          mkdir -p ~/.cache/ms-playwright
          cid=$(docker create "${image}")
          # The official image stores browsers at /ms-playwright; copy them into
          # the default cache location Playwright looks in on the host runner.
          docker cp "${cid}:/ms-playwright/." ~/.cache/ms-playwright/
          docker rm "${cid}"

      - name: Verify Chromium is present (no CDN download)
        run: |
          if ! ls -d ~/.cache/ms-playwright/chromium-* >/dev/null 2>&1; then
            echo "::error::Chromium was not provisioned into ~/.cache/ms-playwright"
            ls -la ~/.cache/ms-playwright 2>/dev/null || true
            exit 1
          fi
          echo "Chromium present:"
          ls -d ~/.cache/ms-playwright/chromium-*

      - name: Run E2E tests
        timeout-minutes: 30
        run: npx playwright test

      - name: Collect service logs
        if: always()
        run: |
          docker compose -f tests/e2e/docker-compose.yml logs --tail=500 > /tmp/docker-compose-logs.txt 2>&1 || true

      - name: Tear down services
        if: always()
        run: |
          docker compose -f tests/e2e/docker-compose.yml down -v --remove-orphans || true

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-report
          path: |
            test-results/
            playwright-report/
            /tmp/docker-compose-logs.txt
          retention-days: 7
          if-no-files-found: ignore

  summary:
    runs-on: ubuntu-latest
    needs: [e2e]
    if: always()
    name: e2e-summary
    steps:
      - name: Summary status
        run: |
          if [[ "${{ needs.e2e.result }}" != "success" && "${{ needs.e2e.result }}" != "skipped" ]]; then
            exit 1
          fi
