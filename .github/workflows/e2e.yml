# E2E integration tests for Astrolabe frontend
#
# Runs Playwright tests against a real Nextcloud + MCP server environment
# using docker-compose. The MCP server runs in login-flow mode.
#
# SPDX-FileCopyrightText: 2025 Astrolabe contributors
# SPDX-License-Identifier: MIT

name: E2E Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      mcp_server_tag:
        description: 'MCP server image tag (e.g. 0.66.1). Defaults to latest release.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: e2e

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        with:
          fallbackNode: '^22'
          fallbackNpm: '^10'

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Get php version
        id: php-versions
        uses: icewind1991/nextcloud-version-matrix@58becf3b4bb6dc6cef677b15e2fd8e7d48c0908f # v1.3.1
        with:
          filename: appinfo/info.xml

      - name: Set up PHP ${{ steps.php-versions.outputs.php-max }}
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a # v2.33.0
        with:
          php-version: ${{ steps.php-versions.outputs.php-max }}
          coverage: none

      - name: Install dependencies & build app
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          composer install --no-dev --optimize-autoloader
          npm ci
          npm run build

      - name: Resolve MCP server tag
        id: mcp-tag
        run: |
          if [ -n "${{ inputs.mcp_server_tag }}" ]; then
            echo "tag=${{ inputs.mcp_server_tag }}" >> $GITHUB_OUTPUT
          else
            TAG=$(gh api repos/cbcoutinho/nextcloud-mcp-server/releases/latest --jq '.tag_name' | sed 's/^v//')
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
          fi
          echo "Using MCP server tag: $(cat $GITHUB_OUTPUT | grep tag= | cut -d= -f2)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test
        env:
          MCP_SERVER_TAG: ${{ steps.mcp-tag.outputs.tag }}

      - name: Collect service logs on failure
        if: failure()
        run: |
          docker compose -f tests/e2e/docker-compose.yml logs --tail=500 > /tmp/docker-compose-logs.txt 2>&1 || true

      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: |
            test-results/
            playwright-report/
            /tmp/docker-compose-logs.txt
          retention-days: 7

  summary:
    runs-on: ubuntu-latest
    needs: [e2e]
    if: always()
    name: e2e-summary
    steps:
      - name: Summary status
        run: if ${{ needs.e2e.result != 'success' && needs.e2e.result != 'skipped' }}; then exit 1; fi
