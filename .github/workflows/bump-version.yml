name: Bump version

on:
  push:
    branches:
      - main

# Run at most one bump/release at a time. Concurrent pushes to main must not
# both bump the version and push tags, which has caused release failures in the
# past. Queue subsequent pushes instead of cancelling an in-flight bump/release.
concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump-version:
    if: "!startsWith(github.event.head_commit.message, 'bump:') && !startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    name: "Bump version and create changelog"
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # uv provides both the Python and commitizen — `uvx` runs the pinned
      # version from an ephemeral environment, so there is nothing to install
      # into the runner and no unpinned `pip install` resolving whatever is on
      # PyPI at run time (githubactions:S8544 / S8541).
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail

          echo "Checking for version bump..."
          # The pin tracks the commitizen pre-commit hook rev in
          # .pre-commit-config.yaml; renovate manages both. 4.18.0 is what the
          # previously-unpinned `pip install commitizen` resolved to, so this is
          # a pin at the status quo, not a version change. Do not drop back to
          # 4.9.0: its wheel imports `deprecated` without declaring it, so an
          # isolated `uvx` environment fails at import.
          if ! output=$(uvx --from commitizen==4.18.0 cz --config .cz.toml bump --yes 2>&1); then
            if echo "$output" | grep -q "\[NO_COMMITS_TO_BUMP\]"; then
              echo "No commits eligible for version bump"
              echo "$output"
              echo "bumped=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Version bump failed"
            echo "$output"
            exit 1
          fi

          echo "$output"
          echo "bumped=true" >> $GITHUB_OUTPUT
          tag=$(git tag --sort=-creatordate | head -n 1)
          echo "tag=$tag" >> $GITHUB_OUTPUT

      # One atomic push, so the bump commit and its tag land together or not at
      # all. As two commands the branch could land while the tag failed — which
      # happened on 0.39.2, when the tag ref hit a transient GitHub 500 — and
      # that state cannot be repaired by re-running: `actions/checkout` pins to
      # the event SHA, so every attempt rebuilds the same bump commit and is
      # rejected non-fast-forward against the `main` the first attempt already
      # moved. The tag had to be pushed by hand. Atomically, a rejected tag
      # leaves `main` untouched and a re-run simply works.
      - name: Push tags
        if: steps.bump.outputs.bumped == 'true'
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: git push --atomic origin "HEAD:refs/heads/main" "refs/tags/${TAG}"

      - name: Summary
        run: |
          if [ "${{ steps.bump.outputs.bumped }}" == "true" ]; then
            tag=$(git tag --sort=-creatordate | head -n 1)
            echo "## Version Bump Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Astrolabe**: \`$tag\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Tag has been pushed and release workflow has been triggered." >> $GITHUB_STEP_SUMMARY
          else
            echo "## Version Bump Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No version bump required - no relevant commits found since last release." >> $GITHUB_STEP_SUMMARY
          fi

  release:
    needs: bump-version
    if: needs.bump-version.outputs.bumped == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump-version.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
