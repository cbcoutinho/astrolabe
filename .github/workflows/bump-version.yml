name: Bump version

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    if: "!startsWith(github.event.head_commit.message, 'bump:') && !startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    name: "Bump version and create changelog"
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install commitizen
        run: pip install commitizen

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail

          echo "Checking for version bump..."
          if ! output=$(cz --config .cz.toml bump --yes 2>&1); then
            if echo "$output" | grep -q "\[NO_COMMITS_TO_BUMP\]"; then
              echo "No commits eligible for version bump"
              echo "$output"
              echo "bumped=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Version bump failed"
            echo "$output"
            exit 1
          fi

          echo "$output"
          echo "bumped=true" >> $GITHUB_OUTPUT
          tag=$(git tag --sort=-creatordate | head -n 1)
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Push tags
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git push
          git push --tags

      - name: Summary
        run: |
          if [ "${{ steps.bump.outputs.bumped }}" == "true" ]; then
            tag=$(git tag --sort=-creatordate | head -n 1)
            echo "## Version Bump Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Astrolabe**: \`$tag\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Tag has been pushed and release workflow has been triggered." >> $GITHUB_STEP_SUMMARY
          else
            echo "## Version Bump Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No version bump required - no relevant commits found since last release." >> $GITHUB_STEP_SUMMARY
          fi

  release:
    needs: bump-version
    if: needs.bump-version.outputs.bumped == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump-version.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
