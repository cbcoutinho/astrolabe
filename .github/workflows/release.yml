name: Build and Publish Astrolabe App Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'The tag to release (e.g. v0.13.3)'
        required: true
        type: string

env:
  APP_NAME: astrolabe

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Validate version in info.xml matches tag
        run: |
          INFO_VERSION=$(sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' appinfo/info.xml | tr -d '\t')
          if [ "$INFO_VERSION" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "Version mismatch: info.xml has $INFO_VERSION but tag is ${{ steps.resolve.outputs.version }}"
            exit 1
          fi
          echo "Version validated: $INFO_VERSION"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: 8.2
          coverage: none

      - name: Checkout Nextcloud server (for signing)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: nextcloud/server
          ref: stable30
          path: server

      - name: Install dependencies and build
        run: |
          composer install --no-dev --optimize-autoloader
          npm ci
          npm run build

      - name: Setup signing certificate
        run: |
          mkdir -p $HOME/.nextcloud/certificates
          echo "${{ secrets.APP_PRIVATE_KEY }}" > $HOME/.nextcloud/certificates/${{ env.APP_NAME }}.key
          echo "${{ secrets.APP_PUBLIC_CRT }}" > $HOME/.nextcloud/certificates/${{ env.APP_NAME }}.crt

      - name: Extract changelog for this version
        id: changelog
        run: |
          version="${{ steps.resolve.outputs.version }}"
          # Extract content between this version's header and the next version header
          body=$(awk "/^## v${version//./\\.} /{found=1; next} /^## v[0-9]/{if(found) exit} found{print}" CHANGELOG.md)
          # Use GH delimiter for multiline output
          {
            echo "body<<CHANGELOG_EOF"
            echo "$body"
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

      - name: Build app store package
        run: make appstore server_dir=${{ github.workspace }}/server

      - name: Create GitHub release and attach tarball
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/artifacts/${{ env.APP_NAME }}.tar.gz
          asset_name: ${{ env.APP_NAME }}-${{ steps.resolve.outputs.version }}.tar.gz
          tag: refs/tags/${{ steps.resolve.outputs.tag }}
          release_name: Astrolabe ${{ steps.resolve.outputs.version }}
          prerelease: ${{ contains(steps.resolve.outputs.version, '-alpha') || contains(steps.resolve.outputs.version, '-beta') || contains(steps.resolve.outputs.version, '-rc') }}

      - name: Upload to Nextcloud App Store
        uses: R0Wi/nextcloud-appstore-push-action@ad2020a77eb694e8fe145d2ebd6bc21c246240fd # v1.0.5
        with:
          app_name: ${{ env.APP_NAME }}
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          download_url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.resolve.outputs.tag }}/${{ env.APP_NAME }}-${{ steps.resolve.outputs.version }}.tar.gz
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          nightly: ${{ contains(steps.resolve.outputs.version, '-alpha') || contains(steps.resolve.outputs.version, '-beta') || contains(steps.resolve.outputs.version, '-rc') }}
