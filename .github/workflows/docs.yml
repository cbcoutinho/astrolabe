name: Docs site CI

# Typecheck + build the Fumadocs documentation app in docs/ so a broken build
# or type error surfaces on the PR rather than at Vercel deploy time. Scoped to
# docs/** so it never runs on Nextcloud-app or marketing-site changes. The
# actual deploy is handled by Vercel (git-connected), not here.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Skip Next.js' outbound telemetry call on every CI run.
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # Restore Next.js' build cache so incremental builds reuse compiled
      # output. Keyed on lockfile + source so it busts when either changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.next/cache
          key: ${{ runner.os }}-nextjs-docs-${{ hashFiles('docs/package-lock.json') }}-${{ hashFiles('docs/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-docs-${{ hashFiles('docs/package-lock.json') }}-

      - run: npm ci --no-audit --no-fund

      # Generates .source types (fumadocs-mdx), then runs next typegen + tsc.
      - run: npm run typecheck

      - run: npm run build
