name: Pact record deployment

# Records a production deployment of astrolabe in the Pact Broker (ADR-029).
# This is the missing half of the can-i-deploy loop: can-i-deploy checks the
# candidate against whatever is currently in `production`, and this workflow
# tells the broker what `production` now contains.
#
# Trigger: called by bump-version.yml after the release job publishes. It
# deliberately does NOT trigger on `push: tags: v*` — bump-version pushes tags
# with GITHUB_TOKEN, and tags pushed with GITHUB_TOKEN do not trigger
# workflows. It was originally wired that way and so only ever ran on the
# hand-pushed v0.39.2 tag; `production` stayed empty for every later release.
#
# Version identity: as a called workflow, ${{ github.sha }} is the caller's
# triggering commit — the main commit that prompted the bump. That is the SHA
# pact.yml published consumer pacts and provider verification results under.
# The "bump: version ..." commit is pushed with GITHUB_TOKEN, so pact.yml never
# runs on it and the broker has no pacts for it; recording it (or the tag
# string) would leave can-i-deploy red.
#
# workflow_dispatch exists for a one-off bootstrap or repair: pass the main
# commit that preceded the release's bump commit (the bump commit's parent).
#
# The broker is only reachable over Tailscale; the step no-ops when the broker
# secrets are absent (e.g. forks).
#
# Required repo/org secrets:
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET  Tailscale github-runner OAuth client
#   PACT_BROKER / PACT_USERNAME / PACT_PASSWORD  broker URL + basic auth

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: "Commit SHA to record as deployed (the bump commit's parent)"
        required: true
        type: string

# Two releases landing close together could overlap; don't cancel an in-flight
# recording — let it complete.
concurrency:
  group: pact-record-deployment-${{ github.ref }}
  cancel-in-progress: false

env:
  PACT_BROKER: ${{ secrets.PACT_BROKER }}
  PACT_USERNAME: ${{ secrets.PACT_USERNAME }}
  PACT_PASSWORD: ${{ secrets.PACT_PASSWORD }}

jobs:
  record-deployment:
    name: Record production deployment
    runs-on: ubuntu-latest
    # Least-privilege: scope the token at job level (GitHub Actions S8264).
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # Needed for .github/scripts/install-pact-cli.sh.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Join tailnet
        if: ${{ env.PACT_BROKER != '' }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-runner

      - name: Install Pact CLI
        if: ${{ env.PACT_BROKER != '' }}
        run: .github/scripts/install-pact-cli.sh

      - name: Record deployment to production
        if: ${{ env.PACT_BROKER != '' }}
        env:
          # Dispatch input when bootstrapping, otherwise the caller's SHA.
          VERSION: ${{ inputs.version || github.sha }}
        run: |
          pact broker record-deployment \
            --broker-base-url "$PACT_BROKER" \
            --broker-username "$PACT_USERNAME" \
            --broker-password "$PACT_PASSWORD" \
            --pacticipant astrolabe \
            --version "$VERSION" \
            --environment production
