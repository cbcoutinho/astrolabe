name: Deploy marketing site to GitHub Pages

# Builds the static Astrolabe Cloud marketing site in website/ and publishes it
# to GitHub Pages at astrolabecloud.com. Scoped to website/** so it never runs
# on Nextcloud-app changes. Repo Settings -> Pages -> Source must be
# "GitHub Actions"; the custom domain (astrolabecloud.com) comes from
# website/public/CNAME.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/landing-pages.yml'
  workflow_dispatch:

# Permissions are scoped per job (below) rather than workflow-wide: the build
# job only needs read access to check out the repo, while the deploy job needs
# the pages/id-token write scopes. Least privilege keeps each job's token small.

# Allow one concurrent deploy; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # `pages: write` lets the configure-pages step below enable GitHub Pages via
    # the API (enablement: true) so the deploy job's first run can't 404 on a
    # repo where Pages was never turned on in Settings.
    permissions:
      contents: read
      pages: write
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Enable GitHub Pages (build_type: workflow) if it isn't already, so
      # actions/deploy-pages has a Pages site to publish to. Idempotent: a
      # no-op once Pages is enabled.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      # Restore Next.js' build cache so incremental builds reuse compiled
      # output. Keyed on lockfile + source so it busts when either changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('website/package-lock.json') }}-${{ hashFiles('website/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('website/package-lock.json') }}-

      - run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Build static export
        env:
          # Portal origin baked into the static build (production portal).
          NEXT_PUBLIC_PORTAL_URL: https://app.astrolabecloud.com
        run: |
          # Bake the build year into the static HTML so the footer copyright
          # tracks the deploy date rather than whenever the source last
          # changed. The site redeploys on every push, so it stays current.
          export NEXT_PUBLIC_BUILD_YEAR="$(date -u +%Y)"
          npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
