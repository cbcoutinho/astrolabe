# Pact contract tests (ADR-029). astrolabe plays both Pact roles:
#
#   * consumer-publish — astrolabe's McpServerClient is the CONSUMER of the MCP
#     server's /api/v1 API; this job generates that pact and publishes it to the
#     broker (the MCP server repo verifies it).
#   * provider-verify  — astrolabe is the PROVIDER for the credentials status
#     contract the MCP server publishes; this job verifies it.
#
# The broker is only reachable over Tailscale, so broker-dependent steps no-op
# when the secrets are absent (forks).
#
# Required repo/org secrets:
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET  Tailscale github-runner OAuth client
#   PACT_BROKER / PACT_USERNAME / PACT_PASSWORD  broker URL + basic auth
#
# NOTE: provider verification is gated on the provider-state endpoint described
# in tests/contract/README.md, which is not yet implemented. Until it lands this
# job verifies whatever state-less interactions exist and is a no-op otherwise.

name: Pact

on:
  pull_request:
  push:
    branches:
      - main

# Permissions are declared per-job (GitHub Actions least-privilege: scope the
# token to each job rather than the whole workflow).
concurrency:
  group: pact-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PACT_BROKER: ${{ secrets.PACT_BROKER }}
  PACT_USERNAME: ${{ secrets.PACT_USERNAME }}
  PACT_PASSWORD: ${{ secrets.PACT_PASSWORD }}

jobs:
  consumer-publish:
    runs-on: ubuntu-latest
    name: Consumer pacts (astrolabe -> mcp)
    permissions:
      contents: read
    # Skip on forks / when the broker is not configured.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.3 (with ffi)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: ffi, ctype, curl, dom, iconv, intl, json, mbstring, openssl, posix, xml, zip
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --no-progress

      - name: Generate consumer pacts
        run: ./vendor/bin/phpunit -c tests/contract/phpunit.xml --filter McpServerClientPactTest --colors=never

      # Publish only from non-fork builds that have the broker secrets.
      - name: Join tailnet
        if: ${{ env.PACT_BROKER != '' }}
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-runner

      - name: Install Pact CLI
        if: ${{ env.PACT_BROKER != '' }}
        run: |
          # Unified pact CLI (Rust, pact-foundation/pact-cli) — replaces the
          # deprecated pact-ruby-standalone `pact-broker` CLI, which now only
          # warns and is unmaintained. Matches nextcloud-mcp-server.
          #
          # Deliberately NOT the official pact-foundation/pact-cli composite
          # action: renovate.json extends config:best-practices, which includes
          # helpers:pinGitHubActionDigests, and the action derives the binary
          # version from github.action_ref — a digest-pinned ref matches no
          # vX.Y.Z pattern and silently falls through to releases/latest. This
          # pinned URL is renovate-managed via the customManager in renovate.json.
          curl -fsSL https://github.com/pact-foundation/pact-cli/releases/download/v0.10.7/pact-installer.sh | sh
          echo "$HOME/.pact/bin" >> "$GITHUB_PATH"

      - name: Publish pacts to broker
        if: ${{ env.PACT_BROKER != '' }}
        run: |
          pact broker publish tests/contract/pacts \
            --broker-base-url "$PACT_BROKER" \
            --broker-username "$PACT_USERNAME" \
            --broker-password "$PACT_PASSWORD" \
            --consumer-app-version "${{ github.sha }}" \
            --branch "${{ github.head_ref || github.ref_name }}"

  provider-verify:
    runs-on: ubuntu-latest
    name: Provider verification (mcp -> astrolabe)
    permissions:
      contents: read
    # Skip on forks / when the broker is not configured.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.3 (with ffi)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: ffi, ctype, curl, dom, iconv, intl, json, mbstring, openssl, posix, xml, zip
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --no-progress

      # TODO: stand up Nextcloud + astrolabe as the provider and export
      # PACT_PROVIDER_URL once the provider-state endpoint (tests/contract/
      # README.md) exists. Until then the verify step skips (no PACT_PROVIDER_URL).

      - name: Join tailnet
        if: ${{ env.PACT_BROKER != '' }}
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-runner

      - name: Verify provider against broker pacts
        if: ${{ env.PACT_BROKER != '' }}
        env:
          PACT_PROVIDER_VERSION: ${{ github.sha }}
          PACT_PROVIDER_BRANCH: ${{ github.head_ref || github.ref_name }}
          PACT_PUBLISH_RESULTS: ${{ github.ref == 'refs/heads/main' }}
        # Only the provider test here; the consumer pact is generated/published
        # by the consumer-publish job above.
        run: ./vendor/bin/phpunit -c tests/contract/phpunit.xml --filter CredentialsPactVerifyTest --colors=never

  can-i-deploy:
    runs-on: ubuntu-latest
    name: can-i-deploy
    permissions:
      contents: read
    timeout-minutes: 10
    needs: [consumer-publish, provider-verify]
    # Only meaningful on main (the branch we publish verification results from).
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Join tailnet
        if: ${{ env.PACT_BROKER != '' }}
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-runner

      - name: Install Pact CLI
        if: ${{ env.PACT_BROKER != '' }}
        run: |
          # See the consumer job above for why this is a pinned installer URL
          # and not the official composite action.
          curl -fsSL https://github.com/pact-foundation/pact-cli/releases/download/v0.10.7/pact-installer.sh | sh
          echo "$HOME/.pact/bin" >> "$GITHUB_PATH"

      # SHADOW MODE: run can-i-deploy for signal but never fail the workflow.
      # The broker's `production` environment is populated by the
      # pact-record-deployment workflow on each repo's next release; until both
      # astrolabe AND nextcloud-mcp-server have recorded a prod deployment this
      # check cannot pass, so gating now would block every merge on a bootstrap
      # gap rather than a real incompatibility. Once it reports a pass in both
      # repos, promote to a hard gate by removing the `set +e`/`exit 0` wrapper
      # and relocating it ahead of the deploy step.
      - name: Can I deploy astrolabe? (shadow — non-blocking)
        if: ${{ env.PACT_BROKER != '' }}
        run: |
          set +e
          pact broker can-i-deploy \
            --broker-base-url "$PACT_BROKER" \
            --broker-username "$PACT_USERNAME" \
            --broker-password "$PACT_PASSWORD" \
            --pacticipant astrolabe \
            --version "$GITHUB_SHA" \
            --to-environment production
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=can-i-deploy (shadow)::can-i-deploy exited $rc — NOT gating (shadow mode). Expected until both repos record a production deployment."
          else
            echo "can-i-deploy passed (shadow mode — not yet gating)"
          fi
          exit 0
