# Pact contract tests (ADR-029). astrolabe plays both Pact roles:
#
#   * consumer-publish — astrolabe's McpServerClient is the CONSUMER of the MCP
#     server's /api/v1 API; this job generates that pact and publishes it to the
#     broker (the MCP server repo verifies it).
#   * provider-verify  — astrolabe is the PROVIDER for the credentials status
#     contract the MCP server publishes; this job verifies it.
#
# The broker is only reachable over Tailscale, so broker-dependent steps no-op
# when the secrets are absent (forks).
#
# Required repo/org secrets:
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET  Tailscale github-runner OAuth client
#   PACT_BROKER / PACT_USERNAME / PACT_PASSWORD  broker URL + basic auth
#
# provider-verify replays the pacts against this branch's astrolabe in the e2e
# docker stack, seeding states through the provider-state hook
# (tests/contract/README.md).

name: Pact

on:
  pull_request:
  push:
    branches:
      - main

# Permissions are declared per-job (GitHub Actions least-privilege: scope the
# token to each job rather than the whole workflow).
concurrency:
  group: pact-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PACT_BROKER: ${{ secrets.PACT_BROKER }}
  PACT_USERNAME: ${{ secrets.PACT_USERNAME }}
  PACT_PASSWORD: ${{ secrets.PACT_PASSWORD }}

jobs:
  consumer-publish:
    runs-on: ubuntu-latest
    name: Consumer pacts (astrolabe -> mcp)
    permissions:
      contents: read
    # Skip on forks / when the broker is not configured.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.3 (with ffi)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: ffi, ctype, curl, dom, iconv, intl, json, mbstring, openssl, posix, xml, zip
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --no-progress

      - name: Generate consumer pacts
        run: ./vendor/bin/phpunit -c tests/contract/phpunit.xml --filter McpServerClientPactTest --colors=never

      # Publish only from non-fork builds that have the broker secrets.
      - name: Join tailnet
        if: ${{ env.PACT_BROKER != '' }}
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-runner

      - name: Install Pact CLI
        if: ${{ env.PACT_BROKER != '' }}
        run: .github/scripts/install-pact-cli.sh

      - name: Publish pacts to broker
        if: ${{ env.PACT_BROKER != '' }}
        run: |
          pact broker publish tests/contract/pacts \
            --broker-base-url "$PACT_BROKER" \
            --broker-username "$PACT_USERNAME" \
            --broker-password "$PACT_PASSWORD" \
            --consumer-app-version "${{ github.sha }}" \
            --branch "${{ github.head_ref || github.ref_name }}"

  provider-verify:
    runs-on: ubuntu-latest
    name: Provider verification (mcp -> astrolabe)
    permissions:
      contents: read
    # Skip on forks / when the broker is not configured.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.3 (with ffi)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: ffi, ctype, curl, dom, iconv, intl, json, mbstring, openssl, posix, xml, zip
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --no-progress

      # The provider is this branch's astrolabe in the e2e stack (Nextcloud +
      # MariaDB + Redis; the MCP server is not needed). It is built from a
      # second checkout without dev dependencies, because the stack mounts the
      # checkout as the app and the verifier's pact-php/phpunit must not end up
      # on Nextcloud's autoloader. Like the verify step, these need the broker:
      # without it there is nothing to verify, so they are skipped.
      - name: Checkout provider
        if: ${{ env.PACT_BROKER != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: provider

      - name: Read package.json node and npm engines version
        if: ${{ env.PACT_BROKER != '' }}
        uses: skjnldsv/read-package-engines-version-actions@06d6db44aa62f4609ba070f556ec24bc99fb85cb # v4
        id: versions
        with:
          path: provider
          fallbackNode: '^22'
          fallbackNpm: '^10'

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        if: ${{ env.PACT_BROKER != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        if: ${{ env.PACT_BROKER != '' }}
        run: npm i -g --ignore-scripts 'npm@${{ steps.versions.outputs.npmVersion }}' # NOSONAR (githubactions:S8543)

      - name: Build provider app
        if: ${{ env.PACT_BROKER != '' }}
        working-directory: provider
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          composer install --no-dev --optimize-autoloader --no-progress
          npm ci --ignore-scripts
          npm run build

      - name: Start provider (Nextcloud + astrolabe)
        if: ${{ env.PACT_BROKER != '' }}
        timeout-minutes: 15
        run: docker compose -f provider/tests/e2e/docker-compose.yml up -d --wait app

      # Turn on the provider-state hook (TEST-ONLY, system config) and mint an
      # admin app password for the verifier to authenticate with. The user must
      # stay `admin`: the per-user state is seeded for
      # PactProviderStateController::VERIFIER_USER.
      - name: Configure provider
        if: ${{ env.PACT_BROKER != '' }}
        id: provider
        run: |
          occ() { docker compose -f provider/tests/e2e/docker-compose.yml exec -T -u www-data -e OC_PASS=admin app php occ "$@"; }
          occ config:system:set astrolabe.pact_state_endpoint_enabled --value=true --type=boolean
          token=$(occ user:auth-tokens:add --password-from-env admin | tail -n 1 | tr -d '[:space:]')
          [ -n "$token" ] || { echo "::error::occ user:auth-tokens:add printed no app password"; exit 1; }
          echo "::add-mask::$token"
          echo "auth=admin:$token" >> "$GITHUB_OUTPUT"

      - name: Join tailnet
        if: ${{ env.PACT_BROKER != '' }}
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-runner

      - name: Verify provider against broker pacts
        if: ${{ env.PACT_BROKER != '' }}
        env:
          PACT_PROVIDER_URL: http://localhost:8080
          PACT_PROVIDER_AUTH: ${{ steps.provider.outputs.auth }}
          PACT_PROVIDER_REQUIRED: 'true'
          PACT_PROVIDER_VERSION: ${{ github.sha }}
          PACT_PROVIDER_BRANCH: ${{ github.head_ref || github.ref_name }}
          PACT_PUBLISH_RESULTS: ${{ github.ref == 'refs/heads/main' }}
        # Only the provider test here; the consumer pact is generated/published
        # by the consumer-publish job above.
        run: ./vendor/bin/phpunit -c tests/contract/phpunit.xml --filter CredentialsPactVerifyTest --colors=never

      - name: Provider logs
        if: failure()
        run: docker compose -f provider/tests/e2e/docker-compose.yml logs --tail=300 app

      - name: Tear down provider
        if: always()
        run: docker compose -f provider/tests/e2e/docker-compose.yml down -v --remove-orphans || true

  can-i-deploy:
    runs-on: ubuntu-latest
    name: can-i-deploy
    permissions:
      contents: read
    timeout-minutes: 10
    needs: [consumer-publish, provider-verify]
    # Only meaningful on main (the branch we publish verification results from).
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      # Needed for .github/scripts/install-pact-cli.sh; this job previously ran
      # without a working copy.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Join tailnet
        if: ${{ env.PACT_BROKER != '' }}
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-runner

      - name: Install Pact CLI
        if: ${{ env.PACT_BROKER != '' }}
        run: .github/scripts/install-pact-cli.sh

      # SHADOW MODE: run can-i-deploy for signal but never fail the workflow.
      # The broker's `production` environment is populated by the
      # pact-record-deployment workflow on each repo's next release; until both
      # astrolabe AND nextcloud-mcp-server have recorded a prod deployment this
      # check cannot pass, so gating now would block every merge on a bootstrap
      # gap rather than a real incompatibility. Once it reports a pass in both
      # repos, promote to a hard gate by removing the `set +e`/`exit 0` wrapper
      # and relocating it ahead of the deploy step.
      - name: Can I deploy astrolabe? (shadow — non-blocking)
        if: ${{ env.PACT_BROKER != '' }}
        run: |
          set +e
          pact broker can-i-deploy \
            --broker-base-url "$PACT_BROKER" \
            --broker-username "$PACT_USERNAME" \
            --broker-password "$PACT_PASSWORD" \
            --pacticipant astrolabe \
            --version "$GITHUB_SHA" \
            --to-environment production
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=can-i-deploy (shadow)::can-i-deploy exited $rc — NOT gating (shadow mode). Expected until both repos record a production deployment."
          else
            echo "can-i-deploy passed (shadow mode — not yet gating)"
          fi
          exit 0
